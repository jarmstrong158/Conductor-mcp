name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest only
        # server.py is stdlib-only (urllib, json, sys) and should stay that
        # way: it is launched by an MCP client, not installed into a managed
        # environment. No `cache: pip` — there is no dependency file to hash
        # and setup-python treats that as a hard error.
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest -q
